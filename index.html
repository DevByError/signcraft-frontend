<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignCraft - Digital Signage Software</title>
    <link rel="icon" type="image/png" href="/favi.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#1B263B', // Navy Blue
              primaryLight: '#415A77', // Lighter Navy for hovers
              secondary: '#778DA9', // Muted Blue/Grey
              ivory: '#FDFBF7', // Main Background (Ivory)
              vanilla: '#F2E8CF', // Darker Vanilla/Beige
              surface: '#FFFFFF', // Pure White for cards
              black: '#0D0D0D', // Deep Black
              dark: '#000000', // Pure Black
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* Ensure the app fills the viewport and removes default body margin */
      html, body, #root {
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
      }
      /* Custom scrollbar for editor panels */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #FDFBF7;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #415A77;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #1B263B;
      }
      body {
        background-color: #FDFBF7;
        color: #0D0D0D;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
